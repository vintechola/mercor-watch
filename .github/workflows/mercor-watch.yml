name: Mercor watch

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mercor-watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check Mercor
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          KEYWORDS: ${{ vars.KEYWORDS }}
          MIN_RATE: ${{ vars.MIN_RATE }}
          NOTIFY_CLOSED: ${{ vars.NOTIFY_CLOSED }}
          MERCOR_API_URL: ${{ vars.MERCOR_API_URL }}
          MENTION: ${{ vars.MENTION }}
          DOMAIN_MENTIONS: ${{ vars.DOMAIN_MENTIONS }}
          DIGEST_HOUR: ${{ vars.DIGEST_HOUR }}
          LOW_SLOTS: ${{ vars.LOW_SLOTS }}
          SLOTS_UP_MIN: ${{ vars.SLOTS_UP_MIN }}
          MUTE_EVENTS: ${{ vars.MUTE_EVENTS }}
        run: python mercor_watch.py

      - name: Save memory
        run: |
          git config user.name  "mercor-watch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || git commit -m "update state"
          git pull --rebase -q && git push -q || true
